<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Razorpay Test Checkout</title>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 40px;
      width: 420px;
    }
    h1 { font-size: 20px; margin-bottom: 6px; }
    p.sub { font-size: 13px; color: #94a3b8; margin-bottom: 28px; }
    label { font-size: 13px; color: #94a3b8; display: block; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 10px 14px;
      background: #0f172a;
      border: 1px solid #006aff;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 14px;
      margin-bottom: 18px;
      outline: none;
    }
    input:focus { border-color: #6366f1; }
    button {
      width: 100%;
      padding: 12px;
      background: #6366f1;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #4f46e5; }
    button:disabled { background: #374151; cursor: not-allowed; }
    .result {
      margin-top: 20px;
      padding: 14px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }
    .result.success { background: #064e3b; border: 1px solid #059669; color: #6ee7b7; }
    .result.error   { background: #450a0a; border: 1px solid #dc2626; color: #fca5a5; }
    pre { white-space: pre-wrap; word-break: break-all; }
  </style>
</head>
<body>
<div class="card">
  <h1>🧪 Razorpay Test Checkout</h1>
  <p class="sub">Uses Razorpay test mode — no real money charged</p>

  <label>JWT Token (from login)</label>
  <input type="text" id="jwt" placeholder="Bearer eyJhbG..." />

  <label>Order ID (from your order service)</label>
  <input type="text" id="orderId" placeholder="uuid of your order" />

  <label>Razorpay Key ID</label>
  <input type="text" id="keyId" placeholder="rzp_test_xxxxxxxxxx" />

  <button id="payBtn" onclick="startPayment()">💳 Pay Now (Test)</button>

  <div class="result" id="result"></div>
</div>

<script>
  async function startPayment() {
    const jwt     = document.getElementById('jwt').value.trim()
    const orderId = document.getElementById('orderId').value.trim()
    const keyId   = document.getElementById('keyId').value.trim()

    if (!jwt || !orderId || !keyId) {
      showResult('error', 'Please fill all fields')
      return
    }

    const btn = document.getElementById('payBtn')
    btn.disabled = true
    btn.textContent = 'Creating payment...'

    // Step 1: Create payment in your backend
    let paymentData
    try {
      const res = await fetch('http://127.0.0.1:3336/payments', {
        method:  'POST',
        headers: {
          'Content-Type':  'application/json',
          'Authorization': jwt.startsWith('Bearer') ? jwt : `Bearer ${jwt}`,
          'X-Idempotency-Key': `pay-${orderId}-${Date.now()}`,
        },
        body: JSON.stringify({ order_id: orderId, gateway: 'RAZORPAY' }),
      })
      paymentData = await res.json()
      console.log('Payment created:', paymentData)
    } catch (err) {
      showResult('error', `Backend error: ${err.message}`)
      btn.disabled = false
      btn.textContent = '💳 Pay Now (Test)'
      return
    }

    const gatewayOrderId = paymentData?.data?.attempts?.[0]?.gateway_order_id
                        || paymentData?.data?.gatewayOrderId
                        || paymentData?.gatewayOrderId
    const paymentId      = paymentData?.data?.id || paymentData?.id
    const amount         = Number(paymentData?.data?.amount || 1)

    if (!gatewayOrderId) {
      showResult('error', `No gatewayOrderId in response:\n${JSON.stringify(paymentData, null, 2)}`)
      btn.disabled = false
      btn.textContent = '💳 Pay Now (Test)'
      return
    }

    // Step 2: Open Razorpay checkout
    btn.textContent = 'Opening Razorpay...'
    const rzp = new Razorpay({
      key:      keyId,
      amount:   Math.max(100, Math.round(amount * 100)),       // paise (min 100 paise)
      currency: 'INR',
      order_id: gatewayOrderId,
      name:     'Food App',
      description: 'Order Payment',
      handler: function(response) {
        // Payment successful — show result
        showResult('success',
          `✅ Payment Successful!\n\n` +
          `payment_id: ${response.razorpay_payment_id}\n` +
          `order_id:   ${response.razorpay_order_id}\n` +
          `signature:  ${response.razorpay_signature}\n\n` +
          `Razorpay webhook will fire automatically.\n` +
          `Check your delivery service for the created delivery!`
        )
        btn.disabled = false
        btn.textContent = '💳 Pay Now (Test)'
      },
      modal: {
        ondismiss: function() {
          btn.disabled = false
          btn.textContent = '💳 Pay Now (Test)'
        }
      },
      prefill: {
        name:    'Test User',
        email:   'test@foodapp.com',
        contact: '9999999999',
      },
      theme: { color: '#6366f1' },
    })

    rzp.open()
  }

  function showResult(type, msg) {
    const el = document.getElementById('result')
    el.style.display = 'block'
    el.className = `result ${type}`
    el.innerHTML = `<pre>${msg}</pre>`
  }
</script>
</body>
</html>
