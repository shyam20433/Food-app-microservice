openapi: 3.0.3
info:
  title: Restaurant Microservice API
  description: Independent Microservice for managing Restaurants, Addresses, Categories, and Menu Items built with AdonisJS v5 & PostgreSQL.
  version: 1.0.0
servers:
  - url: http://localhost:3334
    description: Local Development Server

paths:
  /health:
    get:
      summary: Service Health Check Endpoint
      responses:
        '200':
          description: Healthy status
        '503':
          description: Service or database unhealthy

  /health/live:
    get:
      summary: Kubernetes Liveness Probe Endpoint
      responses:
        '200':
          description: Service container is live

  /health/ready:
    get:
      summary: Kubernetes Readiness Probe Endpoint
      responses:
        '200':
          description: Database connection is ready
        '503':
          description: Database connection failed

  /restaurants:
    get:
      summary: List Restaurants with Pagination
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 20
        - in: query
          name: search
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
            enum: [ENABLED, DISABLED]
      responses:
        '200':
          description: Restaurants list retrieved successfully

    post:
      summary: Create Restaurant and Optional Address (Transaction)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRestaurantRequest'
      responses:
        '201':
          description: Restaurant created successfully
        '401':
          description: Unauthorized
        '403':
          description: Forbidden

  /restaurants/{id}:
    get:
      summary: Get Restaurant by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Restaurant details retrieved
        '404':
          description: Restaurant not found

    put:
      summary: Update Restaurant
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRestaurantRequest'
      responses:
        '200':
          description: Restaurant updated successfully
        '403':
          description: Access denied (Not owner or admin)
        '404':
          description: Restaurant not found

    delete:
      summary: Soft Delete Restaurant
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Restaurant soft deleted

  /restaurants/{id}/status:
    patch:
      summary: Update Restaurant Lifecycle Status
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [ENABLED, DISABLED]
      responses:
        '200':
          description: Status updated (ENABLED or DISABLED)
        '400':
          description: Invalid status (DELETED must be performed via DELETE /restaurants/{id})

  /restaurants/{id}/restore:
    patch:
      summary: Restore Soft-Deleted Restaurant
      description: Restores a soft-deleted restaurant back to ENABLED status.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Restaurant restored successfully

  /restaurants/{restaurantId}/address:
    get:
      summary: Get Restaurant Primary Address
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Address retrieved
        '404':
          description: Address not found

    post:
      summary: Create Restaurant Primary Address
      description: Creates a primary address. Throws 409 Conflict if an address already exists for this restaurant.
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAddressRequest'
      responses:
        '201':
          description: Address created successfully
        '409':
          description: Address already exists for this restaurant. Use PUT to update.

    put:
      summary: Update Restaurant Address
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestaurantAddressSchema'
      responses:
        '200':
          description: Address updated

    delete:
      summary: Soft Delete Restaurant Address
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Address soft deleted

  /restaurants/{restaurantId}/categories:
    get:
      summary: List Categories for Restaurant
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Categories list retrieved

    post:
      summary: Create Category
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Category created

  /restaurants/{restaurantId}/categories/{categoryId}:
    get:
      summary: Get Category details
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema:
            type: string
        - in: path
          name: categoryId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category details

    put:
      summary: Update Category
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema:
            type: string
        - in: path
          name: categoryId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Category updated

    delete:
      summary: Soft Delete Category
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema:
            type: string
        - in: path
          name: categoryId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Category soft deleted

  /restaurants/{restaurantId}/menu-items:
    get:
      summary: List Menu Items for Restaurant
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Menu items list

    post:
      summary: Create Menu Item
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMenuItemRequest'
      responses:
        '201':
          description: Menu item created

  /restaurants/{restaurantId}/menu-items/{itemId}:
    get:
      summary: Get Menu Item details
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema:
            type: string
        - in: path
          name: itemId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Menu item details

    put:
      summary: Update Menu Item
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema:
            type: string
        - in: path
          name: itemId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMenuItemRequest'
      responses:
        '200':
          description: Menu item updated

    delete:
      summary: Soft Delete Menu Item
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema:
            type: string
        - in: path
          name: itemId
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Menu item soft deleted

  /restaurants/{restaurantId}/menu-items/{itemId}/availability:
    patch:
      summary: Toggle Menu Item Availability (Only modifies is_available)
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: restaurantId
          required: true
          schema:
            type: string
        - in: path
          name: itemId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_available]
              properties:
                is_available:
                  type: boolean
      responses:
        '200':
          description: Menu item availability toggled

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    CreateRestaurantRequest:
      type: object
      required: [name, phone_number, email]
      properties:
        name:
          type: string
          example: Tasty Pizza & Burger
        description:
          type: string
          example: Italian pizzas and gourmet burgers
        phone_number:
          type: string
          example: '+15550001111'
        email:
          type: string
          format: email
          example: contact@tastybites.com
        logo:
          type: string
          example: https://example.com/logo.png
        opening_time:
          type: string
          example: '09:00:00'
        closing_time:
          type: string
          example: '23:00:00'
        delivery_radius:
          type: number
          example: 10.5
        address:
          $ref: '#/components/schemas/RestaurantAddressSchema'

    UpdateRestaurantRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        phone_number:
          type: string
        email:
          type: string
        delivery_radius:
          type: number

    RestaurantAddressSchema:
      type: object
      required: [house_no, street, city, state, pincode]
      properties:
        house_no:
          type: string
          example: '12B'
        street:
          type: string
          example: Food Court Avenue
        area:
          type: string
          example: Downtown
        city:
          type: string
          example: Metropolis
        state:
          type: string
          example: NY
        pincode:
          type: string
          example: '10001'
        latitude:
          type: number
          example: 40.7128
        longitude:
          type: number
          example: -74.006

    CreateMenuItemRequest:
      type: object
      required: [category_id, name, price]
      properties:
        category_id:
          type: string
          format: uuid
        name:
          type: string
          example: Margherita Pizza
        description:
          type: string
        price:
          type: number
          example: 14.99
        is_vegetarian:
          type: boolean
          example: true
        preparation_time:
          type: integer
          example: 20
        is_available:
          type: boolean
          example: true

    UpdateMenuItemRequest:
      type: object
      properties:
        category_id:
          type: string
        name:
          type: string
        price:
          type: number
        is_vegetarian:
          type: boolean
        preparation_time:
          type: integer
        is_available:
          type: boolean
