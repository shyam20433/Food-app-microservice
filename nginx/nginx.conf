worker_processes auto;

events {
  worker_connections 1024;
}

http {

  # ── Logging ──────────────────────────────────────────────────────────────────
  log_format main '$remote_addr - $request_method $request_uri $status '
                  '"$http_user_agent" rt=$request_time';
  access_log logs/access.log main;
  error_log  logs/error.log warn;

  # ── Global settings ──────────────────────────────────────────────────────────
  sendfile          on;
  keepalive_timeout 65;
  client_max_body_size 10M;

  # ── Rate limiting zones ───────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=auth_limit:10m    rate=10r/m;
  limit_req_zone $binary_remote_addr zone=payment_limit:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=api_limit:10m     rate=100r/m;

  # ── Upstream services ────────────────────────────────────────────────────────
  upstream user_service {
    server 127.0.0.1:3333;
    keepalive 16;
  }

  upstream restaurant_service {
    server 127.0.0.1:3334;
    keepalive 16;
  }

  upstream order_service {
    server 127.0.0.1:3335;
    keepalive 16;
  }

  upstream payment_service {
    server 127.0.0.1:3336;
    keepalive 16;
  }

  upstream delivery_service {
    server 127.0.0.1:3337;
    keepalive 16;
  }

  # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────────
  server {
    listen 80;
    server_name localhost;

    # Redirect all HTTP traffic to HTTPS
    return 301 https://$host$request_uri;
  }

  # ── HTTPS Main server ─────────────────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name localhost;

    # ── SSL Certificate ─────────────────────────────────────────────────────────
    ssl_certificate     C:/Users/shyam/OneDrive/Desktop/microservices/nginx/certs/nginx.crt;
    ssl_certificate_key C:/Users/shyam/OneDrive/Desktop/microservices/nginx/certs/nginx.key;

    # ── SSL Security settings ───────────────────────────────────────────────────
    ssl_protocols             TLSv1.2 TLSv1.3;         # only secure protocols
    ssl_ciphers               HIGH:!aNULL:!MD5;         # strong ciphers only
    ssl_prefer_server_ciphers on;
    ssl_session_cache         shared:SSL:10m;           # cache SSL handshakes
    ssl_session_timeout       10m;

    # ── Security headers ────────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000" always; # force HTTPS for 1 year
    add_header X-Frame-Options           DENY;                       # prevent clickjacking
    add_header X-Content-Type-Options    nosniff;                    # prevent MIME sniffing
    add_header X-XSS-Protection          "1; mode=block";            # XSS protection

    # ── Common proxy headers (applied to all routes) ────────────────────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization     $http_authorization;

    # ── Proxy timeouts ──────────────────────────────────────────────────────────
    proxy_connect_timeout 10s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # ── Health check ────────────────────────────────────────────────────────────
    location /health {
      return 200 '{"status":"nginx_ok","ssl":true}';
      add_header Content-Type application/json;
    }

    # ── User Service → /api/auth & /api/users ───────────────────────────────────
    location /api/auth/ {
      limit_req zone=auth_limit burst=5 nodelay;
      proxy_pass http://user_service/auth/;
    }

    location /api/users/ {
      limit_req zone=api_limit burst=20 nodelay;
      proxy_pass http://user_service/users/;
    }

    # ── Restaurant Service ───────────────────────────────────────────────────────
    location /api/restaurants/ {
      limit_req zone=api_limit burst=20 nodelay;
      proxy_pass http://restaurant_service/restaurants/;
    }

    location /api/menu/ {
      limit_req zone=api_limit burst=20 nodelay;
      proxy_pass http://restaurant_service/menu/;
    }

    # ── Order Service ────────────────────────────────────────────────────────────
    location /api/orders/ {
      limit_req zone=api_limit burst=20 nodelay;
      proxy_pass http://order_service/orders/;
    }

    location /api/cart/ {
      limit_req zone=api_limit burst=20 nodelay;
      proxy_pass http://order_service/cart/;
    }

    # ── Payment Service ──────────────────────────────────────────────────────────
    location /api/payments/ {
      limit_req zone=payment_limit burst=3 nodelay;
      proxy_pass http://payment_service/payments/;
    }

    # ── Delivery Service ─────────────────────────────────────────────────────────
    location /api/deliveries/ {
      limit_req zone=api_limit burst=20 nodelay;
      proxy_pass http://delivery_service/deliveries/;
    }

    location /api/delivery-partners/ {
      limit_req zone=api_limit burst=20 nodelay;
      proxy_pass http://delivery_service/delivery-partners/;
    }

    location /api/admin/ {
      limit_req zone=api_limit burst=10 nodelay;
      proxy_pass http://delivery_service/admin/;
    }

    # ── 404 fallback ─────────────────────────────────────────────────────────────
    location / {
      return 404 '{"success":false,"message":"Route not found"}';
      add_header Content-Type application/json;
    }
  }
}
