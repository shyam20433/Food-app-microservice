openapi: 3.0.3
info:
  title: User & Authentication Microservice API
  description: High-performance User & Identity Management Microservice built with AdonisJS v5 & PostgreSQL.
  version: 1.0.0
servers:
  - url: http://localhost:3333
    description: Local Development Server

paths:
  /health:
    get:
      summary: Microservice Health Check Endpoint
      description: Returns combined status of service and PostgreSQL connection.
      responses:
        '200':
          description: Service is healthy
        '503':
          description: Service or database is unhealthy

  /health/live:
    get:
      summary: Kubernetes Liveness Probe Endpoint
      description: Indicates if service container is alive.
      responses:
        '200':
          description: Service is live

  /health/ready:
    get:
      summary: Kubernetes Readiness Probe Endpoint
      description: Live PostgreSQL database connection test.
      responses:
        '200':
          description: Service is ready to process traffic
        '503':
          description: Service is not ready

  /auth/register:
    post:
      summary: Register New User
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, phone_number, password]
              properties:
                name:
                  type: string
                  example: Jane Doe
                email:
                  type: string
                  format: email
                  example: jane.doe@example.com
                phone_number:
                  type: string
                  example: '+15550100099'
                password:
                  type: string
                  format: password
                  example: SecretPass123!
      responses:
        '201':
          description: User registered successfully

  /auth/register-full:
    post:
      summary: All-in-One Complete Registration (User, Roles, Address & Tokens)
      description: Creates a user, assigns initial role(s), attaches initial address, and generates JWT access/refresh tokens in a single atomic database transaction.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, phone_number, password]
              properties:
                name:
                  type: string
                  example: Alex Morgan
                email:
                  type: string
                  format: email
                  example: alex.morgan@example.com
                phone_number:
                  type: string
                  example: '+15550100888'
                password:
                  type: string
                  format: password
                  example: SecretPass123!
                role:
                  type: string
                  example: RESTAURANT_OWNER
                address:
                  type: object
                  required: [house_no, street, city, state, pincode]
                  properties:
                    label:
                      type: string
                      example: WORK
                    house_no:
                      type: string
                      example: Suite 500
                    street:
                      type: string
                      example: Innovation Way
                    area:
                      type: string
                      example: Tech District
                    city:
                      type: string
                      example: San Jose
                    state:
                      type: string
                      example: CA
                    pincode:
                      type: string
                      example: '95110'
                    is_default:
                      type: boolean
                      example: true
      responses:
        '201':
          description: User, roles, address, and tokens generated successfully

  /auth/login:
    post:
      summary: User Login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: jane.doe@example.com
                password:
                  type: string
                  format: password
                  example: SecretPass123!
      responses:
        '200':
          description: Login successful returning JWT & Refresh Token

  /auth/me:
    get:
      summary: Fetch Current Authenticated User Profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user profile returned

  /users:
    get:
      summary: List Users (Paginated)
      security:
        - BearerAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of active users with pagination meta

  /users/{id}/assign-role:
    post:
      summary: Assign System Role to User
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_name]
              properties:
                role_name:
                  type: string
                  example: ADMIN
      responses:
        '200':
          description: Role assigned successfully

  /users/{id}/remove-role:
    delete:
      summary: Remove System Role from User
      security:
        - BearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [role_name]
              properties:
                role_name:
                  type: string
                  example: ADMIN
      responses:
        '200':
          description: Role removed successfully

  /roles:
    get:
      summary: Read-Only System Roles List
      security:
        - BearerAuth: []
      responses:
        '200':
          description: List of system roles

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
